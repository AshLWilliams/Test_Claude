<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>Level Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>⛑ Level Runner</h1>
  <!-- сцена: на компьютере — окно 16:9, на телефоне — весь экран; в вертикальном положении поворачивается на 90° -->
  <div id="stage">
    <canvas id="game"></canvas>
    <form id="nameForm" hidden>
      <input id="nameInput" maxlength="20" placeholder="Ваше имя" autocomplete="nickname">
      <button>В рейтинг</button>
    </form>
  </div>
  <p class="hint">← → / A D — бег · Пробел / ↑ / W — прыжок (↓ + прыжок — спрыгнуть с лесов) · J / X / клик — удар рейкой · P — пауза · M — звук</p>
  <p class="hint"><a href="../">Другая игра: Star Dodger</a></p>
</main>
<script src="audio.js"></script>
<script src="engine.js"></script>
<!-- участки кампании: каждый — отдельная тема (см. THEMES.md) -->
<script src="themes/01-city.js"></script>
<script src="themes/02-pit.js"></script>
<script src="themes/03-metro.js"></script>
<script src="themes/04-mine.js"></script>
<script src="themes/05-quarry.js"></script>
<script src="themes/06-road.js"></script>
<script src="themes/07-bridge.js"></script>
<script src="themes/08-tower.js"></script>
<script src="themes/09-tundra.js"></script>
<script src="themes/10-dam.js"></script>
<script>startGame();</script>
</body>
</html>
