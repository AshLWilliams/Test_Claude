<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Level Runner</title>
<link rel="stylesheet" href="style.css?v=20261002b">

<body>
<main>
  <h1>⛑ Level Runner</h1>
  <!-- сцена: на компьютере — окно 16:9, на телефоне — весь экран; в вертикальном положении поворачивается на 90° -->
  <div id="stage">
    <canvas id="game"></canvas>
    <form id="nameForm" hidden>
      <input id="nameInput" maxlength="20" placeholder="Ваше имя" autocomplete="nickname">
      <button>В рейтинг</button>
    </form>
  </div>
  <p class="hint">← → / A D — бег · Пробел / ↑ / W — прыжок (↓ + прыжок — спрыгнуть с лесов) · J / X / клик — удар рейкой · P — пауза · M — звук</p>
  <p class="hint credit"><img src="img/bear-surveyor.jpg" alt="Bear Surveyor" width="28" height="28"> Игра сделана для группы <a href="https://t.me/bearsurveyor" target="_blank" rel="noopener">Bear Surveyor</a></p>
  <p class="hint">Другие игры: <a href="../topograf/">Топограф — топосъёмка</a> · <a href="../">Star Dodger</a></p>
</main>
